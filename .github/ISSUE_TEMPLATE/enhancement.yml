name: Enhancement
description: Improve an existing feature
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important this enhancement is
      options:
        - P0 - CRITICAL
        - P1 – HIGH
        - P2 – MEDIUM
        - P3 – LOW
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Request
      description: Briefly describe what you want to improve.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: What is wrong or could be better?
  - type: textarea
    id: links
    attributes:
      label: Links / examples
      description: Link, screenshot, example if needed.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      description: Please confirm
      options:
        - label: This enhancement is about an existing feature
          required: true
        - label: This is not a blocking bug
          required: true
