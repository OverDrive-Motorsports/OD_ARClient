name: General request
description: Generic ticket for a product/tech/doc need
title: "[Request]: "
labels: ["A EVALUER"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Importance
      options:
        - P0 - Mandatory
        - P1 - Important
        - P2 - Optional
        - P3 - Low priority
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please describe the request in detail.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the request and the expected result.
      placeholder: "As a [persona], I want [need] so that [benefit]."
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: Split into concrete tasks if possible.
      value: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to specs, mockups, discussions, related tickets.
      placeholder:  link to doc / code or screenshot
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      description: Please confirm
      options:
        - label: This feature doesn't already exist in the tickets or in the app
          required: true
        - label: This request is aligned with the roadmap
          required: true
