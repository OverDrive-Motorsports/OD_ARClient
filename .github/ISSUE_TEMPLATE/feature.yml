name: Feature
description: New feature
title: "[Feature]: "
labels: ["FEAT"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Importance
      options:
        - P0 - Mandatory
        - P1 - Important
        - P2 - Optional
        - P3 - Low priority
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Request
      description: Briefly describe the feature you want.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why
      description: What problem does it solve, or what is the benefit?
  - type: textarea
    id: links
    attributes:
      label: Links / examples
      description: Link, screenshot, example if needed.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      description: Please confirm
      options:
        - label: This feature doesn't already exist in the tickets or in the app
          required: true
        - label: This request is aligned with the roadmap
          required: true
