name: Bug
description: Report a problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent the bug is
      options:
        - P0 - CRITICAL
        - P1 – HIGH
        - P2 – MEDIUM
        - P3 – LOW
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what doesn't work.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: 1) ... 2) ... 3) ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Device, browser, version, screenshot if needed.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      description: Please confirm the following
      options:
        - label: I searched the existing tickets and this bug hasn't been reported yet
          required: true
